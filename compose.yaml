x-workspace: &workspace
  image: soundlines-workspace-dev
  build:
    context: .
    dockerfile: Dockerfile.dev
  working_dir: /workspace
  volumes:
    - .:/workspace
    - pnpm_store:/pnpm/store
    - workspace_modules:/workspace/node_modules
    - web_modules:/workspace/apps/web/node_modules
    - companion_modules:/workspace/apps/companion/node_modules
    - storybook_modules:/workspace/apps/storybook/node_modules
    - tokens_modules:/workspace/packages/design-tokens/node_modules
    - web_ui_modules:/workspace/packages/ui-web/node_modules
    - next_cache:/workspace/apps/web/.next

x-dev-service: &dev-service
  <<: *workspace
  depends_on:
    dependencies:
      condition: service_completed_successfully

services:
  dependencies:
    <<: *workspace
    command: pnpm install --frozen-lockfile --store-dir /pnpm/store

  soundlines:
    <<: *dev-service
    container_name: soundlines-dev
    restart: unless-stopped
    command: pnpm dev --hostname 0.0.0.0 --port 5173
    environment:
      NEXT_PUBLIC_SOUNDLINES_COMPANION_URL: http://localhost:${SITE_PORT:-5174}/soundlines
    ports:
      - "5173:5173"

  storybook:
    <<: *dev-service
    command: sh -c 'pnpm storybook --host 0.0.0.0 --no-open --exact-port --port "$$STORYBOOK_PORT"'
    environment:
      STORYBOOK_DISABLE_TELEMETRY: "1"
      NEXT_PUBLIC_SOUNDLINES_COMPANION_URL: http://localhost:${SITE_PORT:-5174}/soundlines
      STORYBOOK_PORT: ${STORYBOOK_PORT:-6008}
    ports:
      - "127.0.0.1:${STORYBOOK_PORT:-6008}:${STORYBOOK_PORT:-6008}"

  site:
    <<: *dev-service
    command: sh -c 'pnpm dev:site --host 0.0.0.0 --strictPort --port "$$SITE_PORT"'
    environment:
      SITE_PORT: ${SITE_PORT:-5174}
      VITE_SOUNDLINES_APP_URL: http://localhost:5173/
      VITE_SOUNDLINES_STORYBOOK_URL: http://localhost:${STORYBOOK_PORT:-6008}/
    ports:
      - "127.0.0.1:${SITE_PORT:-5174}:${SITE_PORT:-5174}"

volumes:
  pnpm_store:
  workspace_modules:
  web_modules:
  companion_modules:
  storybook_modules:
  tokens_modules:
  web_ui_modules:
  next_cache:
