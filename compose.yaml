services:
  soundlines:
    image: node:22-alpine
    container_name: soundlines-dev
    restart: unless-stopped
    working_dir: /app
    # Install inside the container (host node_modules has macOS-native
    # binaries) and expose Next.js outside the container network.
    command: sh -c "npm ci && npm run dev -- --hostname 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - next_cache:/app/.next

  storybook:
    image: node:22-alpine
    working_dir: /app
    command: sh -c 'npm ci && npm run storybook -- --host 0.0.0.0 --no-open --exact-port --port "$$STORYBOOK_PORT"'
    environment:
      STORYBOOK_DISABLE_TELEMETRY: "1"
      STORYBOOK_PORT: ${STORYBOOK_PORT:-6008}
    ports:
      - "127.0.0.1:${STORYBOOK_PORT:-6008}:${STORYBOOK_PORT:-6008}"
    volumes:
      - .:/app
      - storybook_node_modules:/app/node_modules

  site:
    image: node:22-alpine
    working_dir: /app
    command: sh -c 'npm ci && npm run dev:site -- --host 0.0.0.0 --strictPort --port "$$SITE_PORT"'
    environment:
      SITE_PORT: ${SITE_PORT:-5174}
    ports:
      - "127.0.0.1:${SITE_PORT:-5174}:${SITE_PORT:-5174}"
    volumes:
      - .:/app
      - site_node_modules:/app/node_modules

volumes:
  node_modules:
  next_cache:
  storybook_node_modules:
  site_node_modules:
