    for (const [genre, ...values] of rows) {

      const label = document.createElement('th');

      row.append(label);
      for (const value of values) {

        cell.className = 'text-end';

      }
      result.append(row);
    }
    body.replaceChildren(result);
    status.textContent = rows.length + ' of ' + scores.length + ' genres';
