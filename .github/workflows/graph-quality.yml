name: Graph quality

on:
  pull_request:
    paths:
      - 'src/data/**'
      - 'src/graph/**'
      - 'src/i18n/routing.ts'
      - 'docs/**'
      - 'scripts/graph/reviewStatus.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/graph-quality.yml'
  push:
    branches: [main]
    paths:
      - 'src/data/**'
      - 'src/graph/**'
      - 'src/i18n/routing.ts'
      - 'docs/**'
      - 'scripts/graph/reviewStatus.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/graph-quality.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Regenerate review status
        run: npm run review-status
      - name: Fail if generated review status is stale
        run: git diff --exit-code -- src/data/review-status.json
      - name: Validate graph data, overlays, evidence and docs counts
        run: npm run validate:graph
