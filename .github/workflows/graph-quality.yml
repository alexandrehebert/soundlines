name: Graph quality

on:
  pull_request:
    paths:
      - 'src/data/**'
      - 'src/graph/**'
      - 'src/i18n/routing.ts'
      - 'docs/**'
      - 'scripts/graph/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/graph-quality.yml'
      - '.github/workflows/graph-contribution-agent.yml'
      - '.github/ISSUE_TEMPLATE/graph-contribution.yml'
  push:
    branches: [main]
    paths:
      - 'src/data/**'
      - 'src/graph/**'
      - 'src/i18n/routing.ts'
      - 'docs/**'
      - 'scripts/graph/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/graph-quality.yml'
      - '.github/workflows/graph-contribution-agent.yml'
      - '.github/ISSUE_TEMPLATE/graph-contribution.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Test graph contribution automation
        run: npm test -- scripts/graph/contributionWorkflow.test.ts
      - name: Regenerate review status
        run: npm run review-status
      - name: Fail if generated review status is stale
        run: git diff --exit-code -- src/data/review-status.json
      - name: Validate graph data, catalogue dates, overlays and evidence
        env:
          GRAPH_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: npm run validate:graph
