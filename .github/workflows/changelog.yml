name: Changelog

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'scripts/changelog/**'
      - 'CHANGELOG.md'
      - 'docs/changelog/changelog.json'
      - 'public/open-data-changelog.json'
      - 'src/projectLinks.ts'
      - 'package*.json'
      - '.github/workflows/changelog.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: changelog-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:changelog
      - run: npm run changelog
      - run: npm run changelog -- --check

  persist:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
      - run: npm run changelog
      - name: Commit generated history
        run: |
          git add -- CHANGELOG.md docs/changelog/changelog.json public/open-data-changelog.json
          if git diff --cached --quiet; then
            echo "Changelog is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: update generated changelog" \
            -m "Co-authored-by: Copilot <223556219+Copilot@users.noreply.github.com>"
          git push origin HEAD:main
