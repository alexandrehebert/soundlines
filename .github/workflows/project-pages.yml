name: Project companion site

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'site/**'
      - 'src/projectLinks.ts'
      - 'public/favicon.svg'
      # Figures quoted by the companion are computed from these at build time.
      - 'src/data/graph.json'
      - 'docs/graph/evidence/**'
      - 'public/instrument-*/**'
      - 'public/loops/**'
      - '.github/agents/**'
      - '.github/skills/**'
      - 'package.json'
      - 'package-lock.json'
      # The curated public Storybook is published under /storybook/.
      - 'src/**'
      - '.storybook/**'
      - '.github/workflows/project-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: project-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:site
      - run: npm run build:site
      - run: npm run build-storybook:public
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
