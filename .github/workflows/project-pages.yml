name: Project companion site

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'public/favicon.svg'
      - 'public/instrument-icons/**'
      - 'public/instrument-banners/**'
      - '.github/workflows/project-pages.yml'
  pull_request:
    paths:
      - 'site/**'
      - 'public/favicon.svg'
      - 'public/instrument-icons/**'
      - 'public/instrument-banners/**'
      - '.github/workflows/project-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: project-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - run: node --test site/check.mjs
      - run: node site/build.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
