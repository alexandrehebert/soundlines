name: Project companion site

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'apps/companion/**'
      # The public Storybook uses web stories, assets and shared packages.
      - 'apps/storybook/**'
      - 'apps/web/**'
      - 'packages/**'
      # The companion also computes figures from evidence, roles and skills.
      - 'docs/graph/evidence/**'
      - '.agents/roles/**'
      - '.agents/skills/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.base.json'
      - '.github/workflows/project-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: project-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6
        with:
          standalone: true
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:site
      - run: pnpm build:pages
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: apps/companion/dist-pages

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
