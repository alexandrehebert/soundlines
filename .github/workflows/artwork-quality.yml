name: Artwork quality

on:
  pull_request:
    paths:
      - 'packages/media/public/instrument-*/**'
      - 'packages/media/public/genre-artwork/**'
      - 'scripts/artwork/**'
      - 'docs/artwork/**'
      - '.github/agents/artwork-*.agent.md'
      - '.agents/roles/artwork-*.md'
      - '.agents/skills/artwork-*/**'
      - '.github/instructions/instrument-artwork.instructions.md'
      - '.github/workflows/artwork-quality.yml'
      - 'packages/catalogue/data/graph.json'
      - 'packages/design-tokens/src/familyColors.ts'
      - 'apps/web/src/design-system/explorer/InstrumentIcon*'
      - 'apps/web/src/stories/InstrumentArtwork.stories.tsx'
      - 'apps/web/src/stories/fixtures/instrument-artwork-v1/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
  push:
    branches: [main]
    paths:
      - 'packages/media/public/instrument-*/**'
      - 'packages/media/public/genre-artwork/**'
      - 'scripts/artwork/**'
      - 'docs/artwork/**'
      - '.github/agents/artwork-*.agent.md'
      - '.agents/roles/artwork-*.md'
      - '.agents/skills/artwork-*/**'
      - '.github/instructions/instrument-artwork.instructions.md'
      - '.github/workflows/artwork-quality.yml'
      - 'packages/catalogue/data/graph.json'
      - 'packages/design-tokens/src/familyColors.ts'
      - 'apps/web/src/design-system/explorer/InstrumentIcon*'
      - 'apps/web/src/stories/InstrumentArtwork.stories.tsx'
      - 'apps/web/src/stories/fixtures/instrument-artwork-v1/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6
        with:
          standalone: true
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - run: pnpm install --frozen-lockfile
      - name: Lint artwork briefs
        run: node .agents/skills/artwork-brief/scripts/check-brief.mjs
      - name: Validate artwork and generator output
        run: node .agents/skills/artwork-validate/scripts/check-artwork.mjs --require-render
      - name: Validate genre artwork briefs and covers
        run: pnpm artwork:genres --check
      - name: Test artwork validation and app icons
        run: pnpm exec vitest run scripts/artwork/validation.test.ts apps/web/src/design-system/explorer/InstrumentIcon.test.tsx
